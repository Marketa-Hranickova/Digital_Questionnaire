<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accessible Eye Anamnesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Atkinson+Hyperlegible+Mono:wght@400&display=swap">
<style>
/* Layout: one-question-per-screen tablet app, centred column; setup screens are full-height touch zones. */
:root {
  --bg: #FFFFFF; --ink: #0B0B0C; --muted: #3D4048; --line: #5A5F6B; --surface: #F2F4F7;
  --accent: #0B4FB3; --on-accent: #FFFFFF; --sel-bg: #E6EEFB; --sel-ink: #0B0B0C;
  --dot-bg: #0B4FB3; --dot-ink: #FFFFFF; --help: #A63F00; --on-help: #FFFFFF; --focus: #0B4FB3;
  --zone-a: #FFE600; --on-zone-a: #000000; --zone-b: #0B4FB3; --on-zone-b: #FFFFFF;
  --scale: 1;
  --f: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1216; --ink: #F4F6F8; --muted: #C3C8D0; --line: #8A93A3; --surface: #1A1F26;
    --accent: #7DB2FF; --on-accent: #06152B; --sel-bg: #13294A; --sel-ink: #F4F6F8;
    --dot-bg: #7DB2FF; --dot-ink: #06152B; --help: #FFB27A; --on-help: #2A1300; --focus: #7DB2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1216; --ink: #F4F6F8; --muted: #C3C8D0; --line: #8A93A3; --surface: #1A1F26;
  --accent: #7DB2FF; --on-accent: #06152B; --sel-bg: #13294A; --sel-ink: #F4F6F8;
  --dot-bg: #7DB2FF; --dot-ink: #06152B; --help: #FFB27A; --on-help: #2A1300; --focus: #7DB2FF;
  color-scheme: dark;
}
html:root[data-contrast="yellow"] {
  --bg: #000000; --ink: #FFE600; --muted: #FFFFFF; --line: #FFE600; --surface: #000000;
  --accent: #FFE600; --on-accent: #000000; --sel-bg: #FFE600; --sel-ink: #000000;
  --dot-bg: #000000; --dot-ink: #FFE600; --help: #FFFFFF; --on-help: #000000; --focus: #FFFFFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { font-size: 125%; height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--f); font-size: 1rem; line-height: 1.4;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { max-width: 880px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-block: 20px 28px; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 5px solid var(--focus); outline-offset: 4px; }
h1:focus { outline: none; }
svg { flex: none; }

/* Setup zones */
.zone {
  flex: 1; min-height: 150px; border-radius: 28px; border: 4px solid transparent; font: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 24px; text-align: center; cursor: pointer;
}
.zone-start { background: var(--accent); color: var(--on-accent); }
.zone-a { background: var(--zone-a); color: var(--on-zone-a); }
.zone-b { background: var(--zone-b); color: var(--on-zone-b); }
.zone-c { background: var(--surface); color: var(--ink); border-color: var(--line); }
.zone.armed { outline: 8px dashed var(--ink); outline-offset: 6px; }
.zone.zone-slim { flex: 0 0 auto; min-height: 120px; }
.z-big { font-size: calc(clamp(2.4rem, 7vw, 4.2rem) * var(--scale)); font-weight: 800; line-height: 1.05; }
.z-title { font-size: calc(clamp(1.6rem, 4vw, 2.2rem) * var(--scale)); font-weight: 800; line-height: 1.15; text-wrap: balance; }
.z-mid { font-size: calc(1.4rem * var(--scale)); font-weight: 700; }
.z-sub { font-size: calc(1.2rem * var(--scale)); font-weight: 700; }
.z-small { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.armtag { display: inline-block; padding: 6px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 1.1rem; font-weight: 800; }

/* Type */
h1 { margin: 0; font-size: calc(clamp(1.9rem, 4vw + 0.8rem, 2.9rem) * var(--scale)); line-height: 1.15; font-weight: 800; text-wrap: balance; }
.lede, .hint { margin: 0; font-size: calc(1.35rem * var(--scale)); color: var(--muted); }

/* Buttons */
.btn {
  min-height: 68px; padding: 0 20px; border-radius: 16px; border: 3px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit; font-size: calc(1.15rem * var(--scale));
  font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; text-decoration: none;
}
.btn svg { width: 1.4em; height: 1.4em; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn-help { background: var(--help); border-color: var(--help); color: var(--on-help); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-ghost { border-color: var(--accent); color: var(--accent); align-self: flex-start; }
.btn-primary {
  width: 100%; min-height: 100px; border-radius: 20px; font-size: calc(1.55rem * var(--scale));
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}
.btn-primary.armed { outline: 8px dashed var(--ink); outline-offset: 6px; }
.linkbtn {
  align-self: flex-start; min-height: 64px; padding: 0 6px; background: none; border: 0;
  color: var(--accent); font: inherit; font-size: calc(1.3rem * var(--scale)); font-weight: 800;
  text-decoration: underline; text-underline-offset: 6px; cursor: pointer;
}
.linkbtn.armed { outline: 6px dashed var(--ink); outline-offset: 4px; border-radius: 8px; }
.readrow { display: flex; flex-wrap: wrap; gap: 12px; }
.readrow .btn { flex: 1 1 240px; }
.btn-read { min-height: 80px; font-size: calc(1.3rem * var(--scale)); border-color: var(--ink); }
.btn-read.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Header */
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.bar-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.prog { display: flex; flex-direction: column; gap: 8px; }
.prog-text { font-size: calc(1.3rem * var(--scale)); font-weight: 800; }
.track { height: 14px; border-radius: 7px; border: 2px solid var(--line); overflow: hidden; background: var(--surface); }
.fill { height: 100%; background: var(--accent); }
.prog-part { color: var(--muted); font-size: calc(1.1rem * var(--scale)); }
.banner { border-radius: 18px; padding: 18px 22px; background: var(--help); color: var(--on-help); font-size: calc(1.3rem * var(--scale)); font-weight: 800; }

/* Options */
.opts { display: flex; flex-direction: column; gap: 16px; }
.opt {
  width: 100%; min-height: 112px; padding: 16px 24px; border-radius: 20px; border: 3px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: calc(1.7rem * var(--scale));
  font-weight: 800; text-align: left; display: flex; align-items: center; gap: 20px; cursor: pointer;
}
.opt .dot { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--line); background: var(--bg); display: flex; align-items: center; justify-content: center; flex: none; }
.opt .dot svg { width: 28px; height: 28px; }
.opt .lbl { flex: 1; min-width: 0; }
.opt .tag { font-size: calc(1.05rem * var(--scale)); font-weight: 800; }
.opt .num { font-size: calc(1rem * var(--scale)); color: var(--muted); font-weight: 700; }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--accent); background: var(--sel-bg); color: var(--sel-ink); }
.opt[aria-checked="true"] .dot { background: var(--dot-bg); border-color: var(--dot-bg); color: var(--dot-ink); }
.opt[aria-checked="true"] .num { color: inherit; }
.opt.armed { outline: 6px dashed var(--ink); outline-offset: 5px; }

/* Settings */
.panel { border: 3px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: var(--surface); }
.panel h2 { margin: 0; font-size: calc(1.6rem * var(--scale)); }
.setrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.setlabel { display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px; }
.sl-title { font-size: calc(1.35rem * var(--scale)); font-weight: 800; }
.sl-sub { color: var(--muted); font-size: calc(1.1rem * var(--scale)); }
.seg { display: flex; flex-wrap: wrap; gap: 10px; }
.seg .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sq { min-width: 76px; min-height: 76px; font-size: calc(1.5rem * var(--scale)); }
.toggle { width: 100%; min-height: 96px; justify-content: space-between; text-align: left; background: var(--bg); flex-wrap: wrap; padding: 16px 20px; gap: 16px; }
.toggle .tt { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.switch { width: 92px; height: 50px; border-radius: 25px; border: 3px solid var(--ink); padding: 4px; display: flex; align-items: center; flex: none; background: var(--bg); }
.knob { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); }
.toggle[aria-pressed="true"] .switch { justify-content: flex-end; background: var(--accent); border-color: var(--accent); }
.toggle[aria-pressed="true"] .knob { background: var(--on-accent); }
.preview { border: 3px dashed var(--line); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.pv-label { font-size: calc(1.1rem * var(--scale)); font-weight: 800; color: var(--muted); }
.pv-q { font-size: calc(2.1rem * var(--scale)); font-weight: 800; line-height: 1.15; }

/* Review */
.rows { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--ink); }
.row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.row .rtext { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rq { color: var(--muted); font-size: calc(1.1rem * var(--scale)); }
.ra { font-size: calc(1.45rem * var(--scale)); font-weight: 800; }
.ra.open { color: var(--help); }
.summary { border: 3px solid var(--ink); border-radius: 18px; padding: 18px 22px; background: var(--surface); font-size: calc(1.3rem * var(--scale)); font-weight: 800; display: flex; gap: 14px; align-items: center; }
.summary svg { width: 40px; height: 40px; }

.footer { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.small { margin: 0; font-size: calc(1.1rem * var(--scale)); color: var(--muted); text-align: center; }
.done-mark { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.done-mark svg { width: 72px; height: 72px; }
details { border: 2px solid var(--line); border-radius: 16px; padding: 14px 18px; }
summary { cursor: pointer; font-weight: 800; font-size: 1.05rem; min-height: 44px; display: flex; align-items: center; }
details p { margin: 8px 0; color: var(--muted); }
pre { margin: 0; max-height: 360px; overflow: auto; background: var(--surface); padding: 16px; border-radius: 12px; font-family: var(--f-mono); font-size: 0.8rem; line-height: 1.45; }
</style>
</head>

const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

if (canSpeak) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function speak(text, lang, queue) {
  if (!canSpeak || !text) return;
  try {
    if (!queue) window.speechSynthesis.cancel();
    const l = lang || S.lang;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = l === 'de' ? 'de-AT' : 'en-GB';

}

function qSpeech(q, i, n, opts) {

  let s = (opts.prefix || '') + u.qOf(i + 1, n) + '. ' + L(q) + ' ';
  if (q.hint) s += L(q.hint) + ' ';
  q.opts.forEach((o, k) => { s += u.optN(k + 1, L(o)) + ' '; });
  if (opts.withAnswer && S.answers[q.id]) s += u.yourAnswer(labelOf(q, S.answers[q.id])) + ' ';

/* ---------- Render ---------- */
const $app = document.getElementById('app');
function render() {
  const ae = document.activeElement;
  const key = ae && ae.dataset ? ae.dataset.key : null;
  $app.innerHTML = V[S.screen]();
  if (S.focusHeading) {
    S.focusHeading = false;
    window.scrollTo(0, 0);
    const h = $app.querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll: true }); } catch (e) {} }
  } else if (key) {
    const el = $app.querySelector(`[data-key="${key}"]`);
    if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) {} }
  }
  syncSpeak();
}
function go(screen) { S.screen = screen; S.armed = null; S.settings = false; S.needAnswer = false; S.focusHeading = true; render(); }
let wasSpeaking = false;
function isSpeaking() { try { return canSpeak && !!window.speechSynthesis.speaking; } catch (e) { return false; } }
function syncSpeak() {
  const on = isSpeaking(); const u = U();
  $app.querySelectorAll('[data-speak-swap]').forEach((b) => {
    b.classList.toggle('on', on);
    b.innerHTML = on ? `${I.mute}<span>${u.stopReading}</span>` : `${I.speaker}<span>${u.readAll}</span>`;
  });
}
if (canSpeak) setInterval(() => { const s = isSpeaking(); if (s !== wasSpeaking) { wasSpeaking = s; syncSpeak(); } }, 300);

/* ---------- Actions ---------- */
function arm(key, sayIt, action, lang) {
  if (S.armed === key) { S.armed = null; action(); }
  else { S.armed = key; render(); speak(sayIt, lang); }
}
function chooseMode(m) {
  S.mode = m;
  if (m === 'visual') { if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} } go('display'); return; }
  S.idx = 0; go('q');
  if (m === 'audio') { const l = vis(); speak(U().intro + qSpeech(l[0], 0, l.length, { how: true })); }
  else if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}
function advance(prefix) {
  S.armed = null;
  const list = vis(); const nxt = list[S.idx + 1];
  const followUp = nxt && nxt.showIf && !S.answers[nxt.id];
  if ((S.fromReview && !followUp) || S.idx + 1 >= list.length) {
    S.fromReview = false; go('review');
    if (tts()) speak((prefix || '') + U().reviewSpeech(U().openCount(openCount())));
    return;
  }
  S.idx += 1; go('q');
  if (tts()) speak(qSpeech(list[S.idx], S.idx, list.length, { prefix, how: S.idx < 2 }));
}
function pick(v, direct) {
  const list = vis(); const q = list[S.idx]; const o = q.opts.find((o) => o.v === v); if (!o) return;
  if (S.mode === 'audio' && !direct && S.armed !== 'opt-' + v) {
    S.armed = 'opt-' + v; render(); speak(L(o) + '. ' + U().tapAgain); return;
  }
  S.armed = null; S.needAnswer = false; S.answers[q.id] = v;
  if (S.mode === 'audio') advance(U().chosen(L(o)) + ' ');
  else render();
}
function doSend() {
  const list = vis();
  const resp = {
    resourceType: 'QuestionnaireResponse',
    status: 'completed',
    questionnaire: 'Questionnaire/eye-clinic-anamnesis',
    subject: { reference: 'Patient/[ID from the hospital system]' },
    authored: new Date().toISOString(),
    language: S.lang === 'de' ? 'de-AT' : 'en',
    extension: [{ url: 'answer-mode', valueCode: S.mode }],
    item: list.map((q) => {
      const a = S.answers[q.id];
      const it = { linkId: q.id, text: q.de };
      if (a) it.answer = [{ valueCoding: { code: a, display: labelOf(q, a) } }];
      return it;
    })
  };
  S.sent = JSON.stringify(resp, null, 2);
  S.answers = {};
  go('done');
  if (tts()) speak(U().doneSpeech);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act; const v = el.dataset.v; const u = U();
  switch (act) {
    case 'start':
      go('lang');
      speak(UI.de.startSpeech, 'de'); speak(UI.en.startSpeech, 'en', true);
      break;
    case 'arm': {
      const key = el.dataset.arm;
      if (key.startsWith('lang-')) {
        const l = key.slice(5);
        arm(key, l === 'de' ? 'Deutsch. Tippen Sie noch einmal, um zu bestätigen.' : 'English. Tap again to confirm.', () => {
          S.lang = l; applyTheme(); go('mode'); speak(UI[l].modeSpeech);
        }, l);
      } else {
        const m = key.slice(5);
        if (m === 'visual' && canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} }
        arm(key, m === 'visual' ? '' : u.modes[m][0] + '. ' + u.modes[m][1] + '. ' + u.tapAgain, () => chooseMode(m));
      }
      break; }
    case 'pick': pick(v, false); break;
    case 'next': {
      const cq = vis()[S.idx];
      if (!S.answers[cq.id]) { S.needAnswer = true; render(); break; }
      advance(''); break; }
    case 'back': {
      S.armed = null;
      if (S.screen === 'display') { go('mode'); break; }
      if (S.screen === 'review') { S.idx = vis().length - 1; go('q'); }
      else if (S.idx > 0) { S.idx -= 1; go('q'); }
      else { go(S.mode === 'visual' ? 'display' : 'mode'); if (S.screen === 'mode') speak(u.modeSpeech); break; }
      if (tts()) { const l = vis(); speak(qSpeech(l[S.idx], S.idx, l.length, { withAnswer: true })); }
      break; }
    case 'repeat': {
      const l = vis(); const q = l[S.idx];
      speak(qSpeech(q, S.idx, l.length, { how: S.mode === 'audio', withAnswer: true }));
      break; }
    case 'settings':
      S.settings = !S.settings; S.armed = null; render();
      if (S.settings) { const f = $app.querySelector('.panel button'); if (f) f.focus(); }
      else if (S.screen === 'q' && tts()) { const l = vis(); speak(qSpeech(l[S.idx], S.idx, l.length, { how: true, withAnswer: true })); }
      break;
    case 'nurse':
      S.nurse = !S.nurse; render();
      if (S.nurse && (tts() || S.mode === null)) speak(u.nurseCalled);
      break;
    case 'size': S.scale = Math.max(0, Math.min(2, S.scale + Number(v))); applyTheme(); render(); break;
    case 'contrast': S.contrast = !S.contrast; applyTheme(); render(); break;
    case 'setmode':
      S.mode = v; S.armed = null; render();
      if (v !== 'audio' && canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} }
      break;
    case 'speed': S.rate = RATES[Number(v)]; render(); if (canSpeak && S.mode === 'audio') speak(u.speeds[Number(v)]); break;
    case 'setlang': S.lang = v; applyTheme(); render(); break;
    case 'begin': S.idx = 0; go('q'); break;
    case 'change': {
      S.idx = Number(v); S.fromReview = true; go('q');
      if (tts()) { const l = vis(); speak(qSpeech(l[S.idx], S.idx, l.length, { withAnswer: true, how: true })); }
      break; }
    case 'readall': {
      if (isSpeaking()) { try { window.speechSynthesis.cancel(); } catch (e) {} wasSpeaking = false; syncSpeak(); break; }
      const l = vis();
      speak(l.map((q) => `${L(q)} ${S.answers[q.id] ? labelOf(q, S.answers[q.id]) : u.open}`).join(' ... '));
      break; }
    case 'readtoggle': {
      const l = vis(); S.armed = null;
      if (S.mode === 'audio') { S.mode = 'visual'; render(); speak(u.readOff); }
      else { S.mode = 'audio'; render(); speak(qSpeech(l[S.idx], S.idx, l.length, { how: true, withAnswer: true })); }
      break; }
    case 'send':
      if (tts() && S.armed !== 'send') { S.armed = 'send'; render(); speak(u.send + '. ' + u.tapAgain); }
      else doSend();
      break;
    case 'restart':
      if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) {} }
      Object.assign(S, initial()); applyTheme(); S.focusHeading = true; render();
      break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Escape' && S.settings) { S.settings = false; render(); return; }
  if (S.screen !== 'q' || S.settings) return;
  const l = vis(); const q = l[S.idx];
  if (/^[1-9]$/.test(e.key)) {
    const o = q.opts[Number(e.key) - 1];
    if (o) { e.preventDefault(); pick(o.v, true); }
  } else if ((e.key === 'r' || e.key === 'R') && S.mode !== 'sr') {
    e.preventDefault(); speak(qSpeech(q, S.idx, l.length, { how: S.mode === 'audio', withAnswer: true }));
  }
});

applyTheme();
render();
})();
</script>
</body>
</html>
